<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareCompanion</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#2563eb">
</head>
<body>
  <div id="app">
    <!-- ===== LOGIN SCREEN ===== -->
    <div id="login-screen" class="screen">
      <h1>CareCompanion</h1>
      <p>Your health, your way.</p>
      <input type="email" id="login-email" placeholder="Email address">
      <input type="password" id="login-password" placeholder="Password">
      <button id="login-btn">Sign In</button>
      <button id="go-to-signup-btn" class="secondary-btn">Create Account</button>
    </div>

    <!-- ===== SIGNUP SCREEN ===== -->
    <div id="signup-screen" class="screen" style="display:none;">
      <h1>Create Account</h1>
      <input type="email" id="signup-email" placeholder="Email address">
      <input type="password" id="signup-password" placeholder="Password">
      <input type="text" id="signup-name" placeholder="Your full name">
      <button id="signup-btn">Sign Up</button>
      <button id="go-to-login-btn" class="secondary-btn">Back to Login</button>
    </div>

    <!-- ===== MAIN SCREEN ===== -->
    <div id="main-screen" class="screen" style="display:none;">
      <header>
        <h2>Welcome, <span id="user-name">User</span></h2>
        <button id="logout-btn" class="small-btn">Logout</button>
      </header>

      <button id="sos-btn"> SOS</button>

      <h3>Today's Medications</h3>
      <ul id="med-list">
        <li class="empty-msg">No medications added yet.</li>
      </ul>
      <button id="add-med-btn" class="full-width-btn">+ Add Medication</button>
    </div>

    <!-- ===== ADD MEDICATION SCREEN ===== -->
    <div id="add-med-screen" class="screen" style="display:none;">
      <h2>Add Medication</h2>
      <input type="text" id="med-name" placeholder="Medication name (e.g. Aspirin)">
      <input type="time" id="med-time" value="09:00">
      <input type="text" id="med-dose" placeholder="Dose (e.g. 1 tablet)">
      <div id="loading-spinner" style="display: none; text-align: center; margin: 10px 0;">
  <span style="font-size: 2rem;"> </span> Saving...
</div>
      <button id="save-med-btn">Save Medication</button>
      <button id="cancel-add-med-btn" class="secondary-btn">Cancel</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script src="app.js"></script>
</body>
</html>
